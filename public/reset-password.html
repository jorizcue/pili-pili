<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PochaSet 🌶️ — Cambiar contraseña</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="landing-body">
  <div class="landing-container" style="max-width:480px">
    <div class="logo-area">
      <div class="logo-icon">🌶️</div>
      <h1 class="logo-title">PochaSet</h1>
    </div>
    <div class="card-panel">
      <h2 style="font-size:20px;font-weight:800;text-align:center">🔑 Nueva contraseña</h2>
      <div id="resetForm">
        <div class="form-group">
          <label for="newPassword">Nueva contraseña</label>
          <input type="password" id="newPassword" placeholder="Mínimo 6 caracteres" autocomplete="new-password" />
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirmar contraseña</label>
          <input type="password" id="confirmPassword" placeholder="Repite la contraseña" autocomplete="new-password" />
        </div>
        <button class="btn btn-primary" style="width:100%" id="resetBtn">Cambiar contraseña</button>
      </div>
      <div id="resetMsg" class="hidden" style="text-align:center;padding:16px;color:var(--green-bright)"></div>
      <div id="resetErr" class="error-msg hidden"></div>
    </div>
    <p style="text-align:center;margin-top:16px"><a href="/" style="color:var(--text-muted);font-size:13px">← Volver al inicio</a></p>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    if (!token) {
      document.getElementById('resetForm').innerHTML = '<p style="color:var(--accent-orange);text-align:center">Enlace inválido. Solicita uno nuevo.</p>';
    }

    document.getElementById('resetBtn')?.addEventListener('click', async () => {
      const pw = document.getElementById('newPassword').value;
      const cpw = document.getElementById('confirmPassword').value;
      const err = document.getElementById('resetErr');
      err.classList.add('hidden');
      if (pw.length < 6) { err.textContent = 'Mínimo 6 caracteres'; err.classList.remove('hidden'); return; }
      if (pw !== cpw) { err.textContent = 'Las contraseñas no coinciden'; err.classList.remove('hidden'); return; }
      const resp = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password: pw }),
      });
      const data = await resp.json();
      if (data.ok) {
        document.getElementById('resetForm').classList.add('hidden');
        const msg = document.getElementById('resetMsg');
        msg.textContent = '✅ ' + data.message;
        msg.classList.remove('hidden');
        setTimeout(() => window.location.href = '/', 2500);
      } else {
        err.textContent = data.error || 'Error';
        err.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
